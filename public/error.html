<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — AudioNote</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .err-box { text-align: center; padding: 40px; }
    .err-code { font-size: 4rem; font-weight: 900; letter-spacing: -.03em; }
    .err-msg { color: var(--muted, #888); margin: 8px 0 24px; }
    .err-home { color: var(--accent, #7c3aed); text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <div class="err-box">
    <div class="err-code">404</div>
    <p class="err-msg">That track isn't in the library.</p>
    <a class="err-home" href="/">&larr; Back to AudioNote</a>
  </div>
</body>
</html>
